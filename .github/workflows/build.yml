name: Build RocketLeague X360

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Checkout XSDK
        uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          path: xsdk

      - name: Download Champions Field
       run: |
            mkdir -p assets/arena
            curl -L "https://github.com/vinisuxz/RocketLeague-X360/releases/download/v1.0/champions_field_-_rocket_league_stadium.glb" \
              -o assets/arena/champions_field.glb
              
      - name: Install converter dependencies
       run: |
          python3 -m pip install --break-system-packages numpy trimesh

      - name: Convert Champions Field
       run: |
            python3 tools/convert_glb.py \
              assets/arena/champions_field.glb \
              --out build/arena/champions_field.rlar
              
      - name: Build XSDK toolchain
        run: |
          PREFIX="$GITHUB_WORKSPACE/xsdk-gcc"
          WORK="$RUNNER_TEMP/xsdk-gcc-work"

          cd xsdk

          PREFIX="$PREFIX" \
          WORK="$WORK" \
          JOBS=2 \
          bash tools/toolchain/build.sh

      - name: Build XSDK library
        run: |
          make -C xsdk -j2 \
            TOOLCHAIN="$GITHUB_WORKSPACE/xsdk-gcc/bin/powerpc-xsdk-elf-"

      - name: Configure RocketLeague
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$GITHUB_WORKSPACE/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile RocketLeague
        run: |
          cmake --build build

      - name: Upload XEX
        uses: actions/upload-artifact@v4
        with:
          name: RocketLeague-X360
          path: build/RocketLeague.xex
